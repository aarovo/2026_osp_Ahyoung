<!doctype html>
<html>
  <body>
    <!-- Heading: Exercise 1: Facebook -->
    <h1>Exercise 1: Facebook</h1>
    <div style="width: 300px">
      <!-- Logo image: use the logo address on the practice sheet, height 100, and an alt text -->
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png"
        height="100px"
        alt="Facebook Logo"
      />
      <!-- Paragraph -->
      <p width="300px">
        Facebook, Inc. is an American online social media and social networking
        service company. It is based in Menlo Park, California.
      </p>
      <!-- Link with the text "For more click here", using the address on the practice sheet -->
      <a href="https://en.wikipedia.org/wiki/Facebook">For more click here</a>
    </div>

    <form>
      <!-- Name with placeholder -->
      <label for="name">Name:</label>
      <br />
      <input type="text" id="name" name="name" placeholder="Enter your Name" />
      <!-- Age with placeholder -->
      <br />
      <label for="age">Age:</label>
      <br />
      <input type="text" id="age" name="age" placeholder="20" />
      <!-- Gender, then two radio buttons, Male and Female -->
      <!-- Male is selected by default -->
      <br />
      <label for="gender">Gender:</label>
      <br />
      <input type="radio" id="male" name="gender" value="male" checked />
      <label for="male">Male</label>
      <br />
      <input type="radio" id="female" name="gender" value="female" />
      <label for="female">Female</label>
      <br />
      <!-- Submit button-->
      <br />
      <br />
      <input type="submit" value="Signup" />
    </form>
  </body>
</html>
